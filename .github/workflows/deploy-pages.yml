name: Deploy main and online web builds to GitHub Pages

# GitHub Pages provides one site per repository. This workflow publishes two
# Godot exports inside that one site:
#   /project-2/         -> main branch
#   /project-2/online/  -> online branch

on:
  push:
    branches: [main, online]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Checkout online branch
        uses: actions/checkout@v4
        with:
          ref: online
          path: online-source

      - name: Download Godot
        run: |
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: Download Web export templates
        run: |
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          unzip "Godot_v${GODOT_VERSION}_export_templates.tpz" -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"

      - name: Export main branch at site root
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          ./godot --headless --path "$GITHUB_WORKSPACE/main-source" --export-release "Web" "$GITHUB_WORKSPACE/site/index.html"

      - name: Export online branch under online path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site/online"
          ./godot --headless --path "$GITHUB_WORKSPACE/online-source" --export-release "Web" "$GITHUB_WORKSPACE/site/online/index.html"

      - name: Prepare Pages artifact
        run: touch "$GITHUB_WORKSPACE/site/.nojekyll"

      - name: Upload both builds
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both builds to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
